x-app: &app
  user: root
  image: ghcr.io/notch8/adventist_knapsack/web:${TAG:-latest}
  env_file:
    - .env.production
  environment:
    - MAGICK_CONFIGURE_PATH=/etc/ImageMagick-7
    - HYKU_ATTACK_RATE_THROTTLE_OFF=false
    - HYKU_ATTACK_RATE_LIMIT=10
  volumes:
    - .:/app/samvera
    - /store/keep/derivatives:/app/samvera/derivatives
    - /store/keep/branding:/app/samvera/branding
    - /store/keep/exports:/app/samvera/hyrax-webapp/tmp/exports/
    - /store/keep/imports:/app/samvera/hyrax-webapp/tmp/imports/
    - /store/tmp/network-files:/app/samvera/hyrax-webapp/tmp/network-files/
    - /store/tmp/public-assets:/app/samvera/hyrax-webapp/public/assets
      #- /store/tmp/public-uv:/app/samvera/hyrax-webapp/public/uv
    - /store/tmp/uploads:/app/samvera/uploads
    - /store/tmp/uploads:/app/samvera/hyrax-webapp/tmp/uploads
    - /store/keep/public-system:/app/samvera/hyrax-webapp/public/system
    - /store/keep/public-uploads:/app/samvera/hyrax-webapp/public/uploads
    - /store/tmp/ruby-tmp-dir:/tmp
    - /cache:/app/samvera/hyrax-webapp/tmp/cache
  networks:
    internal:
  logging:
    driver: "json-file"
    options:
      max-size: "3g"

x-app-worker: &app-worker
    <<: *app
    environment:
      - HYRAX_FLEXIBLE=false
      - MAGICK_CONFIGURE_PATH=/etc/ImageMagick-7
    image: ghcr.io/notch8/adventist_knapsack/worker:${TAG:-latest}
    # Uncomment command to access container with out starting bin/worker. Useful for debugging or updating Gemfile.lock
    # command: sleep infinity
    depends_on:
      check_volumes:
        condition: service_completed_successfully
      initialize_app:
        condition: service_completed_successfully
      db:
        condition: service_started
      solr:
        condition: service_started
      fcrepo:
        condition: service_started
      redis:
        condition: service_started
      zoo:
        condition: service_started
    restart: unless-stopped

networks:
  internal:

services:
  fits:
    image: ghcr.io/samvera/fitsservlet:1.6.0
    ports:
      - 9090:8080
    networks:
      internal:

  zoo:
    image: zookeeper:3.6.2
    restart: unless-stopped
    environment:
      - ZOO_MY_ID=1
      - ZOO_SERVERS=server.1=zoo:2888:3888;2181
      - ZOO_4LW_COMMANDS_WHITELIST=mntr,srvr,ruok,conf
    expose:
      - 2181
      - 2888
      - 3888
      - 7000
    ports:
      - 2181:2181
      - 7001:7000
    volumes:
      - /store/keep/zoo_data:/data
      - /store/keep/zoo_datalog:/datalog
    networks:
      internal:
        aliases:
          - zookeeper_cluster
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'ruok' | nc -w 2 -q 2 localhost 2181 | grep imok || exit 1",
        ]
      interval: "10s"
      timeout: "8s"

  solr:
    image: ghcr.io/samvera/hyku/solr:latest
    env_file:
      - .env.production
    environment:
      - OOM=script
      - SOLR_ADMIN_USER=${SOLR_ADMIN_USER}
      - SOLR_ADMIN_PASSWORD=${SOLR_ADMIN_PASSWORD}
      - SOLR_COLLECTION_NAME=${SOLR_COLLECTION_NAME}
      - SOLR_CLOUD_BOOTSTRAP=yes
      - SOLR_ENABLE_CLOUD_MODE=yes
      - SOLR_ENABLE_AUTHENTICATION=yes
      - ZK_HOST=zoo:2181
      - SOLR_HEAP=6G
    user: root
    command: bash -c "
      chown -R 8983:8983 /var/solr
      && ./bin/solr zk cp file:/var/solr/data/security.json zk:/security.json
      && runuser -u solr -- solr-foreground"
    expose:
      - 8983
    volumes:
      - /store/keep/solr-data:/var/solr
        #- /solr/security.json:/var/solr/data/security.json
    ports:
      - 8983:8983
    networks:
      internal:
    healthcheck:
      test: curl -sf http://$$SOLR_ADMIN_USER:$$SOLR_ADMIN_PASSWORD@solr:8983/solr/admin/cores?action=STATUS || exit 1
      start_period: 3s
      interval: 5s
      timeout: 5s
      retries: 6
    depends_on:
      zoo:
        condition: service_healthy
    restart: unless-stopped

  fcrepo:
    image: ghcr.io/notch8/docker-fcrepo:4.7.6-s3-streaming
    volumes:
      - /store/keep/fcrepo_data:/data:cached
      - /store/keep/fcrepo_data/jetty-tmp:/var/lib/jetty/tmp
      - /store/keep/fcrepo_data/jetty-work:/var/lib/jetty/work
      - /store/keep/fcrepo_data/jetty-webapps-tmp:/var/lib/jetty/webapps/tmp
    env_file:
      - .env.production
    environment:
      - TMPDIR=/data/tmp
      - JAVA_OPTIONS=-Daws.bucket=samvera-fcrepo -Daws.accessKeyId=${FCREPO_AWS_KEY} -Daws.secretKey=${FCREPO_AWS_SECRET} -Dfcrepo.postgresql.host=db -Dfcrepo.postgresql.username=fcrepo -Dfcrepo.postgresql.password=${FCREPO_DB_PASSWORD} -Dfcrepo.object.directory=/data/objects  -Djava.io.tmpdir=/data/tmp -XX:ConcGCThreads=4 -XX:MaxGCPauseMillis=200 -XX:ParallelGCThreads=20 -XX:+UseG1GC -XX:+UseCompressedOops -XX:-UseLargePagesIndividualAllocation -XX:MaxPermSize=512M -Xms16g -Xmx16g
      - MODESHAPE_CONFIG=classpath:/config/jdbc-postgresql-s3/repository.json
      - FCREPO_DB_PASSWORD=${FCREPO_DB_PASSWORD}
    expose:
      - 8080
    networks:
      internal:

  db:
    image: postgres:14
    env_file:
      - .env.production
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
    volumes:
      - /store/keep/db_data/pg14:/var/lib/postgresql/data
      - /store/keep/db_data/dumps:/dumps:ro
    networks:
      internal:

  web:
    <<: *app
    depends_on:
      db:
        condition: service_started
      solr:
        condition: service_started
      fcrepo:
        condition: service_started
      redis:
        condition: service_started
      zoo:
        condition: service_started
      check_volumes:
        condition: service_started
      worker:
        condition: service_started
      initialize_app:
        condition: service_completed_successfully
    expose:
      - 3000
    ports:
      - 3000:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  worker:
    <<: *app-worker

  worker_aux:
    <<: *app-worker
    environment:
      - AUX_WORKER="true"
      - AUXILIARY_QUEUE_TENANTS="sdapi"
      - AWS_S3_BUCKET=space-stone-production-preprocessedbucketf21466dd-15sun4xy658nh
      - GOOD_JOB_CLEANUP_DISCARDED_JOBS=false
      - GOOD_JOB_CLEANUP_INTERVAL_SECONDS=86400
      - GOOD_JOB_CLEANUP_PRESERVED_JOBS_BEFORE_SECONDS_AGO=604800
      - HYRAX_ACTIVE_JOB_QUEUE=good_job
      - MAGICK_CONFIGURE_PATH=/etc/ImageMagick-7

  # Do not recurse through all of tmp. derivatives will make booting
  # very slow and eventually just time out as data grows
  check_volumes:
    <<: *app
    user: root
    entrypoint: ["sh", "-x", "-c"]
    command:
      - >
        chown -R app:app /app/samvera/hyrax-webapp/public/uploads &&
        chown -R app:app /app/samvera/hyrax-webapp/public/assets &&
        chown -R app:app /app/samvera/hyrax-webapp/tmp/cache

  initialize_app:
    <<: *app
    environment:
      - CONFDIR=/app/samvera/hyrax-webapp/solr/conf
    entrypoint: ["sh", "-c"]
    command:
      - >
        /app/samvera/bin/solrcloud-upload-configset.sh /app/samvera/hyrax-webapp/solr/conf &&
        /app/samvera/bin/solrcloud-assign-configset.sh &&
        SOLR_COLLECTION_NAME=hydra-test /app/samvera/bin/solrcloud-assign-configset.sh &&
        bundle &&
        /app/samvera/bin/db-migrate-seed.sh
    depends_on:
      db:
        condition: service_started
      solr:
        condition: service_healthy
      fcrepo:
        condition: service_started
      redis:
        condition: service_started

  redis:
    image: redis:5
    env_file:
      - .env.production
    command: sh -c 'redis-server --requirepass "$REDIS_PASSWORD"'
    volumes:
      - /store/keep/redis_data:/data
    networks:
      internal:
